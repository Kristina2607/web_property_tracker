[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "web-tracker-imot"
version = "0.1.0"
description = "Desktop web tracker for monitoring real estate listings"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Your Name", email = "your@email.com" }
]

dependencies = [
    "requests",
    "beautifulsoup4",
    "matplotlib",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "pylint",
]


[tool.setuptools]
packages = ["web_tracker_imot"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[tool.coverage.run]
source = ["web_tracker_imot"]
branch = true
omit = [
    "web_tracker_imot/demo.py",
    "web_tracker_imot/main.py",
]


[tool.coverage.report]
show_missing = true
skip_covered = true


[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_configs = true


[tool.pylint.main]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-arguments",
]